# Render blueprint for the VeriCred API and its database.
#
# The UI is not deployed here — it is a static bundle and goes to Vercel (see vercel.json in web/).
# Render hosts the API and PostgreSQL, Vercel hosts the UI, and VITE_API_URL joins them.
#
# Deploy with: Render dashboard -> New -> Blueprint -> point at this repository.

databases:
  - name: vericred-db
    databaseName: vericred
    user: vericred
    plan: free

services:
  - type: web
    name: vericred-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    # The build also seeds the database: generate the dataset, push the schema, load it. All three
    # need devDependencies (tsc, prisma), which exist during build but may be pruned afterwards,
    # so they run here rather than at start-up.
    buildCommand: npm install --include=dev && npm run build && npm run deploy:setup
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vericred-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Render terminates TLS at a proxy, so the client address arrives in X-Forwarded-For.
      # Without this the rate limiters would see one upstream address and throttle everyone together.
      - key: TRUST_PROXY
        value: "true"
      # A free Postgres instance does not need 10,000 credentials to demonstrate the workflow, and a
      # smaller dataset keeps the build inside the free tier's time limit. Raise it to 1 for the
      # full baseline. The seed is fixed either way, so the data is still reproducible.
      - key: SEED_SCALE
        value: "0.05"
      # Set this to the deployed UI origin once Vercel has given you one, e.g.
      #   https://vericred.vercel.app
      # Left unset, CORS stays open — which is the correct default for a public verification API,
      # but narrow it if the API should only serve your own front end.
      - key: CORS_ORIGIN
        sync: false
      # Optional. Without it the AI endpoints return their deterministic fallback.
      - key: OPENAI_API_KEY
        sync: false
